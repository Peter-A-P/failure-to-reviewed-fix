<svg xmlns="http://www.w3.org/2000/svg" width="1216" height="944" viewBox="0 0 1216 944" role="img" aria-label="When ci fails on a pull request in project 03&#x27;s or 04&#x27;s repository, the caller starts the reusable workflow, which reads earlier runs&#x27; spending from their artifacts and stops if the repository&#x27;s US$1.50 is spent, builds an image from the failing commit, reruns the suite in a container with no network, clusters the failures, sends the largest ticket through the unchanged pipeline with every call through the gateway, and posts the result as a comment; it never pushes, opens a pull request or merges, and uploads its record for the next run." font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
