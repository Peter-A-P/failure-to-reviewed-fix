# Why each auto-proposed patch failed the hidden tests (docs/false-positives.md).
# Filled in by hand, by a person who read the hidden tests; no model reads them.
# cause is one of:
#   test_proved_nothing: the generated test passed after the patch but tested something other than the reported bug
#   symptom_not_cause: guarded the point of failure instead of fixing where the bad value came from
#   regression_elsewhere: fixed the reported case and broke one the visible suite does not cover
#   wrong_location: changed the wrong place
#   issue_underspecified: a fair reading of the issue as written, not what the maintainers meant
#   defensible_disagreement: reasonable behaviour the project decided differently: wording, an order, a default
#   unclassified: none of the above
# note is one sentence a reader could check against the diff. Both are required.

- issue_id: django__django-10999
  cause: "issue_underspecified"
  note: "Mend applied the regex proposed in the issue, and its test pinned -1:-2:-3 as valid, while the hidden tests require one leading - to negate the whole duration (-15:30 is -930s) and reject inner signs like -01:-01."

- issue_id: pytest-dev__pytest-5840
  cause: "issue_underspecified"
  note: "Mend's patch does load conftests with their original casing, but the FAIL_TO_PASS tests assert that _conftestpath2mod is keyed by Path(...).resolve(), an internal detail the casing issue never asked for."

- issue_id: scikit-learn__scikit-learn-14983
  cause: "issue_underspecified"
  note: "Mend's repr follows the issue's expected output (n_splits, n_repeats, random_state), but the hidden test expects _build_repr's alphabetical order (n_repeats=6, n_splits=2, ...)."

- issue_id: sphinx-doc__sphinx-7462
  cause: "wrong_location"
  note: "Mend's empty-tuple guard in sphinx/domains/python.py matches the maintainers', but they also fixed unparse in sphinx/pycode/ast.py, which test_unparse[()-()] needs."

- issue_id: sympy__sympy-18763
  cause: "issue_underspecified"
  note: 'Mend''s parenthesize(expr, PRECEDENCE["Mul"], strict=True) handles the issue''s -x + y example, but it leaves x y bare, and the hidden test expects every Subs expression wrapped in \left(...\right), which the issue never asked for.'
